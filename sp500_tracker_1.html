<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="S&P 500">
  <title>S&P 500 Morning Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 0;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .top-bar h1 {
      font-size: 17px;
      font-weight: 600;
      color: #f0f0f0;
    }

    .refresh-btn {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .refresh-btn:active { opacity: 0.7; }

    .price-section {
      text-align: center;
      margin-bottom: 20px;
      padding: 28px 20px;
      background: #111;
      border-radius: 20px;
      border: 1px solid #222;
    }

    .index-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .price-number {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .price-green { color: #34d399; }
    .price-red { color: #f87171; }

    .day-change {
      font-size: 16px;
      font-weight: 500;
    }

    .threshold-line {
      font-size: 12px;
      color: #555;
      margin-top: 8px;
    }

    .alert-bar {
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .alert-buy { background: #052e1a; color: #34d399; border: 1px solid #0d5c35; }
    .alert-above { background: #1a1a1a; color: #888; border: 1px solid #2a2a2a; }
    .alert-crash { background: #2e0505; color: #f87171; border: 1px solid #5c0d0d; }

    .section-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      margin-top: 24px;
    }

    .trend-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .trend-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }

    .trend-period {
      font-size: 11px;
      color: #555;
      margin-bottom: 6px;
    }

    .trend-arrow {
      font-size: 26px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .trend-pct {
      font-size: 13px;
      font-weight: 600;
    }

    .up { color: #34d399; }
    .down { color: #f87171; }
    .neutral { color: #555; }

    .crash-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .crash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
    }

    .crash-row:not(:last-child) {
      border-bottom: 1px solid #1e1e1e;
    }

    .crash-label { color: #888; }
    .crash-ok { color: #34d399; font-weight: 600; }
    .crash-warn { color: #f87171; font-weight: 600; }

    .verdict-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 16px 18px;
    }

    .verdict-label {
      font-size: 12px;
      color: #555;
      margin-bottom: 8px;
    }

    .verdict-text {
      font-size: 15px;
      font-weight: 500;
      color: #e0e0e0;
      line-height: 1.5;
    }

    .timestamp {
      text-align: center;
      font-size: 12px;
      color: #444;
      margin-top: 24px;
    }

    .loading-screen {
      text-align: center;
      padding: 80px 0;
      color: #555;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #222;
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-screen {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    .error-screen h2 { color: #f87171; font-size: 17px; margin-bottom: 12px; }
    .error-screen p { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <h1>S&P 500 Tracker</h1>
    <button class="refresh-btn" onclick="loadData()">&#8635; Refresh</button>
  </div>
  <div id="content">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Fetching market data...</p>
    </div>
  </div>
  <p class="timestamp" id="timestamp"></p>
</div>

<script>
const THRESHOLD = 6500;
const CORS_PROXY = 'https://corsproxy.io/?';
const YAHOO_URL = 'https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=90d';

async function loadData() {
  document.getElementById('content').innerHTML = `
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Fetching market data...</p>
    </div>`;
  document.getElementById('timestamp').textContent = '';

  let data = null;

  try {
    const res = await fetch(YAHOO_URL);
    if (res.ok) {
      const json = await res.json();
      data = extractData(json);
    }
  } catch(e) {}

  if (!data) {
    try {
      const res = await fetch(CORS_PROXY + encodeURIComponent(YAHOO_URL));
      if (res.ok) {
        const json = await res.json();
        data = extractData(json);
      }
    } catch(e) {}
  }

  if (!data) {
    document.getElementById('content').innerHTML = `
      <div class="error-screen">
        <h2>Could not load data</h2>
        <p>Check your internet connection and tap Refresh to try again. Make sure you are connected to WiFi or mobile data.</p>
      </div>`;
    return;
  }

  render(data);
}

function extractData(json) {
  try {
    const result = json.chart.result[0];
    const closes = result.indicators.quote[0].close;
    const timestamps = result.timestamp;
    const valid = closes.map((c, i) => ({ c, t: timestamps[i] })).filter(x => x.c != null);
    if (valid.length < 5) return null;
    return valid;
  } catch(e) { return null; }
}

function trendPct(data, days) {
  if (data.length < days + 1) return null;
  const recent = data[data.length - 1].c;
  const past = data[data.length - 1 - days].c;
  return ((recent - past) / past) * 100;
}

function trendCard(label, pct) {
  if (pct === null) return `<div class="trend-card"><div class="trend-period">${label}</div><div class="trend-arrow neutral">—</div><div class="trend-pct neutral">n/a</div></div>`;
  const up = pct >= 0;
  const cls = up ? 'up' : 'down';
  const arrow = up ? '↑' : '↓';
  return `<div class="trend-card">
    <div class="trend-period">${label}</div>
    <div class="trend-arrow ${cls}">${arrow}</div>
    <div class="trend-pct ${cls}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</div>
  </div>`;
}

function crashRow(label, value, triggered) {
  const cls = triggered ? 'crash-warn' : 'crash-ok';
  const icon = triggered ? '⚠' : '✓';
  return `<div class="crash-row">
    <span class="crash-label">${label}</span>
    <span class="${cls}">${icon} ${value}</span>
  </div>`;
}

function getVerdict(belowThreshold, isCrash, dayCrash, weekCrash, monthChange, dayChange) {
  if (isCrash) return 'Crash signals detected. Do not buy yet — wait for the market to stabilize over several days before making any moves.';
  if (belowThreshold && monthChange !== null && monthChange < -5) return 'Strong dip confirmed. Below 6,500 with a sustained downtrend. This is the buying opportunity you have been waiting for — consider scaling in gradually.';
  if (belowThreshold && monthChange !== null && monthChange < 0) return 'Below 6,500 and trending down. Dip forming. Good time to start watching closely — consider a small first buy.';
  if (belowThreshold) return 'Below 6,500 but trend is mixed. Watch for a few more days to see if it holds or recovers before acting.';
  if (dayChange < -1.5) return 'Noticeable single-day dip but still above 6,500. Stay patient — keep watching.';
  return 'Market is healthy and above 6,500. No action needed today. Stay patient and wait for your entry point.';
}

function render(data) {
  const latest = data[data.length - 1].c;
  const prev = data[data.length - 2].c;
  const dayChange = ((latest - prev) / prev) * 100;
  const weekChange = trendPct(data, 5);
  const monthChange = trendPct(data, 20);
  const quarterChange = trendPct(data, 60);

  const belowThreshold = latest < THRESHOLD;
  const dayCrash = dayChange <= -3;
  const weekCrash = weekChange !== null && weekChange <= -10;
  const isCrash = dayCrash || weekCrash;

  const priceClass = belowThreshold ? 'price-red' : 'price-green';
  const dayClass = dayChange >= 0 ? 'up' : 'down';
  const daySign = dayChange >= 0 ? '+' : '';

  let alertClass, alertText, alertIcon;
  if (isCrash) { alertClass = 'alert-crash'; alertText = 'Crash warning — be cautious'; alertIcon = '⚠'; }
  else if (belowThreshold) { alertClass = 'alert-buy'; alertText = 'Below 6,500 — potential buy zone'; alertIcon = '↓'; }
  else { alertClass = 'alert-above'; alertText = 'Above 6,500 — watching'; alertIcon = '◎'; }

  const priceFormatted = latest.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const verdict = getVerdict(belowThreshold, isCrash, dayCrash, weekCrash, monthChange, dayChange);

  document.getElementById('content').innerHTML = `
    <div class="price-section">
      <div class="index-label">S&P 500 index</div>
      <div class="price-number ${priceClass}">${priceFormatted}</div>
      <div class="day-change ${dayClass}">${daySign}${dayChange.toFixed(2)}% today</div>
      <div class="threshold-line">Target threshold: 6,500</div>
    </div>

    <div class="alert-bar ${alertClass}">${alertIcon} ${alertText}</div>

    <div class="section-label">Trend</div>
    <div class="trend-grid">
      ${trendCard('5 days', weekChange)}
      ${trendCard('20 days', monthChange)}
      ${trendCard('60 days', quarterChange)}
    </div>

    <div class="section-label">Crash detection</div>
    <div class="crash-card">
      ${crashRow('Single day drop', Math.abs(dayChange).toFixed(2) + '% (limit: 3%)', dayCrash)}
      ${weekChange !== null ? crashRow('7-day drop', Math.abs(weekChange).toFixed(2) + '% (limit: 10%)', weekCrash) : ''}
    </div>

    <div class="section-label">Verdict</div>
    <div class="verdict-card">
      <div class="verdict-label">Should I act today?</div>
      <div class="verdict-text">${verdict}</div>
    </div>
  `;

  const now = new Date();
  document.getElementById('timestamp').textContent = 'Updated ' + now.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

loadData();
</script>
</body>
</html>
